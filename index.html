<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Z-City+ Loading Screen</title>
<meta name="viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap">
<style>
:root {
  --panel: rgba(25, 25, 30, 0.86);
  --edge: rgba(155, 0, 0, 0.94);
  --red: #c80000;
  --hot: #e23b3b;
  --text: #f2eeee;
  --dim: #b4adad;
  --ui: "Bahnschrift", "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --logo: "Russo One", "Bahnschrift", "Arial Black", sans-serif;
  --bg: #0b0b0e;
  --panel-solid: rgba(18, 18, 22, 0.97);
  --red-dark: #5a0000;
  --glow: rgba(200, 0, 0, 0.6);
  --hover: rgba(150, 0, 0, 0.3);
  --active: rgba(150, 0, 0, 0.6);
  --pick: rgba(150, 0, 0, 0.75);
  --tab-mark: #ff3b3b;
  --bind: #e8b04a;
  --bind-line: rgba(232, 176, 74, 0.5);
  --logo-main: #ffffff;
  --line: rgba(255, 255, 255, 0.08);
  --chip: rgba(255, 255, 255, 0.05);
  --chip-line: rgba(255, 255, 255, 0.13);
  --faint: rgba(242, 238, 238, 0.5);
  --shadow: rgba(0, 0, 0, 0.8);
  --shade-rgb: 8, 8, 10;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--ui); overflow: hidden; }
[hidden] { display: none !important; }

.bgstack { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; background: var(--bg); }
.bgstack .slide {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden;
  transform: translateX(100%); visibility: hidden;
  transition: transform 1.4s cubic-bezier(0.65, 0, 0.35, 1);
}
.bgstack .slide.first { transform: none; visibility: visible; opacity: 0; transition: opacity 1.2s ease; }
.bgstack .slide.first.show { opacity: 1; }
.bgstack .slide.show { transform: translateX(0); visibility: visible; }
.bgstack .slide.out { transform: translateX(-100%); visibility: visible; }
.bgstack .slide.park { transition: none; }
.bgstack.fade .slide { transform: none; opacity: 0; transition: opacity 1.4s ease; }
.bgstack.fade .slide.show { opacity: 1; }
.bgstack.fade .slide.out { opacity: 0; }
.bgstack.fade .slide.park { transition: none; visibility: hidden; }
.bgstack.none .slide, .bgstack.none .slide.first { transition: none; }
.bgstack img {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; max-width: none;
  object-fit: cover; object-position: 45% 50%;
  transform: scale(1.04);
}
.bgstack .slide.show img { animation: drift 24s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1.04) translateX(0); } to { transform: scale(1.09) translateX(-1.2%); } }
.shade {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(var(--shade-rgb),0.78) 0%, rgba(var(--shade-rgb),0.15) 32%, rgba(var(--shade-rgb),0.1) 60%, rgba(var(--shade-rgb),0.82) 100%),
    radial-gradient(60% 45% at 50% 52%, rgba(var(--shade-rgb),0.45), transparent 70%);
}

.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; justify-content: center;
  padding-top: max(28px, calc(env(safe-area-inset-top, 0px) + 12px));
  pointer-events: none;
}
.logo {
  font-family: var(--logo); font-size: clamp(44px, 6.4vw, 92px); line-height: 1;
  letter-spacing: 0.04em; transform: skewX(-10deg); white-space: nowrap;
  text-shadow: 0 4px 0 var(--shadow), 0 10px 30px var(--shadow);
}
.logo .z { color: var(--red); }
.logo .c { color: var(--logo-main); }
.logo .plus { color: var(--red); font-size: 0.72em; vertical-align: 0.32em; margin-left: 0.06em; }
.logo.haspic { transform: none; }
.logo .logoimg { display: block; max-height: clamp(60px, 9vw, 120px); max-width: 60vw; filter: drop-shadow(0 6px 18px var(--shadow)); }

.info {
  position: fixed; z-index: 2; display: flex; flex-direction: column; gap: 4px;
  top: max(22px, calc(env(safe-area-inset-top, 0px) + 12px));
  left: max(24px, calc(env(safe-area-inset-left, 0px) + 12px));
  max-width: calc(50vw - 220px);
}
.server { font-size: clamp(20px, 2vw, 28px); font-weight: 700; letter-spacing: 0.04em; text-shadow: 0 2px 10px var(--shadow); }
.map { font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); text-shadow: 0 2px 8px var(--shadow); }
.map b { color: var(--text); font-weight: 600; }
.ver { font-size: 12px; color: var(--faint); text-shadow: 0 2px 8px var(--shadow); margin-top: 2px; }

.loader {
  position: fixed; z-index: 2;
  left: max(24px, calc(env(safe-area-inset-left, 0px) + 12px));
  bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 12px));
}
.ring { position: relative; width: 120px; height: 120px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ring:focus-visible { outline: 2px solid var(--hot); outline-offset: 4px; border-radius: 50%; }
.ring svg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; }
.ring .track { fill: none; stroke: var(--chip-line); stroke-width: 5; }
.ring .done { fill: none; stroke: var(--red); stroke-width: 5; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.35s ease; filter: drop-shadow(0 0 4px var(--glow)); }
.ring .pop { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; }
.bigz {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center;
  font-family: var(--logo); font-size: 58px; line-height: 1;
  animation: zturn 2.4s linear infinite;
}
.bigz span {
  display: block; padding: 0 4px;
  background: linear-gradient(0deg, var(--red) 0%, var(--red-dark) 25%, var(--red) 50%, var(--red-dark) 75%, var(--red) 100%);
  background-size: 100% 200%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: zrise 1.6s linear infinite;
  filter: drop-shadow(0 2px 4px var(--shadow));
}
.bigz span.rainbow {
  position: absolute; opacity: 0; transition: opacity 1.5s ease;
  background: linear-gradient(0deg, #ff2a2a, #ff9a1f, #ffe11f, #36d65a, #2fa8ff, #9a4dff, #ff2a2a, #ff9a1f, #ffe11f, #36d65a, #2fa8ff, #9a4dff, #ff2a2a);
  background-size: 100% 200%;
  -webkit-background-clip: text; background-clip: text;
}
.ring.rainbowed .bigz span.rainbow { opacity: 1; }
.ring.rainbowed .done { animation: hue 3s linear infinite; }
.ring .wave { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 50%; border: 3px solid var(--red); opacity: 0; pointer-events: none; }
.ring.hit .pop { animation: zpop 0.45s cubic-bezier(.2,1.6,.4,1); }
.ring.hit .wave { animation: wave 0.6s ease-out; }
.ring.rainbowed .wave { border-color: #ffe11f; }
@keyframes zturn { to { transform: rotate(360deg); } }
@keyframes zrise { from { background-position: 0 0%; } to { background-position: 0 -200%; } }
@keyframes hue { to { filter: hue-rotate(360deg) drop-shadow(0 0 4px var(--glow)); } }
@keyframes zpop { 0% { transform: scale(1); } 35% { transform: scale(1.3) rotate(-12deg); } 100% { transform: scale(1); } }
@keyframes wave { from { opacity: 0.9; transform: scale(0.9); } to { opacity: 0; transform: scale(1.6); } }

.bottom {
  position: fixed; left: 50%; bottom: max(26px, calc(env(safe-area-inset-bottom, 0px) + 12px)); transform: translateX(-50%); z-index: 2;
  width: min(720px, calc(100vw - 340px)); display: flex; flex-direction: column; gap: 8px;
}
.status { font-size: 15px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 2px 8px var(--shadow); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status .count { color: var(--dim); font-weight: 400; letter-spacing: 0.04em; text-transform: none; font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1.5px solid var(--edge); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-sizing: border-box; }
.facts { padding: 12px 20px; text-align: center; }
.facts .head { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hot); margin-bottom: 4px; }
#fact { font-size: 18px; line-height: 1.35; min-height: 1.35em; transition: opacity 0.4s; }
#fact.fade { opacity: 0; }

.rightcol {
  position: fixed; z-index: 3; display: flex; flex-direction: column; gap: 12px;
  top: max(20px, calc(env(safe-area-inset-top, 0px) + 12px));
  right: max(20px, calc(env(safe-area-inset-right, 0px) + 12px));
  width: 360px; max-width: calc(100vw - 32px);
}
.modes { padding: 12px 16px 14px; }
.live { padding: 12px 16px 14px; }
.live .head { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hot); }
.live .head .age { color: var(--dim); letter-spacing: 0.06em; text-transform: none; }
.live .row { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; margin-top: 6px; color: var(--dim); }
.live .row b { color: var(--text); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.live .names { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--dim); }
.live .names b { color: var(--text); font-weight: 600; }
.live .off { margin-top: 6px; font-size: 14px; color: var(--dim); }
.me .myname { font-size: 18px; font-weight: 700; color: var(--text); }
.me .mytitle { font-style: italic; color: var(--hot); }
.me .mylevel { margin-top: 2px; }
.me .mystats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
.me .avatar { float: left; width: 48px; height: 48px; margin: 2px 10px 0 0; border: 1.5px solid var(--edge); }
.modes .head { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hot); }
.modes .head .num { color: var(--dim); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.modes .slide { transition: opacity 0.4s ease; }
.modes .slide.fade { opacity: 0; }
.modes .group { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); margin-top: 10px; }
.modes .name { font-size: 26px; font-weight: 700; line-height: 1.15; margin-top: 2px; }
.modes .kind { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-top: 2px; }
.modes .sub { font-size: 15px; font-weight: 600; font-style: italic; color: var(--hot); margin-top: 6px; }
.modes .desc { font-size: 15px; line-height: 1.4; color: var(--dim); margin-top: 8px; min-height: 4.2em; }

.mapcard { margin-top: 8px; }
.mapcard .label { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); text-shadow: 0 2px 8px var(--shadow); }
.mapcard .big { font-size: clamp(24px, 2.4vw, 34px); font-weight: 700; letter-spacing: 0.04em; text-shadow: 0 2px 10px var(--shadow); word-break: break-all; }
.mapcard .pic { display: block; width: 280px; max-width: 100%; height: 158px; object-fit: cover; border: 1.5px solid var(--edge); margin-top: 6px; background: #000; }
.me { margin-top: 10px; padding: 8px 12px; align-self: flex-start; font-size: 14px; color: var(--dim); line-height: 1.45; }
.me .label { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hot); }
.me b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

/* snake */
.snakebox {
  position: fixed; z-index: 10; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center;
  background: rgba(var(--shade-rgb),0.55); opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.snakebox.open { opacity: 1; visibility: visible; }
.snakewin { width: min(440px, 100%); transform: scale(0.94); transition: transform 0.3s ease; }
.snakebox.open .snakewin { transform: none; }
.snakewin.wide { width: min(990px, 100%, calc((100vh - 170px) * 4 / 3 + 30px)); backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--panel-solid); }
/* while the arcade is open nothing behind it moves or blurs, so the game gets the whole frame */
body.arcadeopen .bgstack .slide.show img, body.arcadeopen .bigz, body.arcadeopen .bigz span, body.arcadeopen .ring.rainbowed .done { animation-play-state: paused; }
body.arcadeopen .panel { backdrop-filter: none; -webkit-backdrop-filter: none; }
.arcadetabs { display: flex; gap: 6px; padding: 10px 14px 0; }
.arcadetabs button { font: 700 13px var(--ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); background: var(--chip); border: 1px solid var(--chip-line); padding: 6px 12px; cursor: pointer; }
.arcadetabs button:hover, .arcadetabs button:focus-visible { color: var(--text); outline: none; border-color: var(--edge); }
.arcadetabs button.on { color: var(--text); background: var(--pick); border-color: var(--edge); }
.danmakubody { padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.danmakuframe { position: relative; width: 100%; height: 0; padding-bottom: 75%; overflow: hidden; background: #000; outline: 1px solid var(--line); }
.danmakuframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
.danmakuhint { font-size: 13px; color: var(--dim); text-align: center; }
.danmakuhint a { color: var(--hot); }
.snakehead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.snaketitle { font-family: var(--logo); font-size: 22px; transform: skewX(-10deg); }
.snaketitle .r { background: linear-gradient(90deg, #ff2a2a, #ff9a1f, #ffe11f, #36d65a, #2fa8ff, #9a4dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.snakehead button { font: 700 18px var(--ui); color: var(--text); background: none; border: 1.5px solid var(--edge); width: 32px; height: 32px; cursor: pointer; }
.snakehead button:hover, .snakehead button:focus-visible { background: var(--pick); outline: none; }
.snakebody { padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.scores { display: flex; justify-content: space-between; width: 100%; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.scores b { color: var(--text); }
#snake { width: 100%; max-width: 400px; aspect-ratio: 1; background: var(--shadow); border: 1px solid var(--line); display: block; box-sizing: border-box; }
.snakehint { font-size: 13px; color: var(--dim); text-align: center; }
.pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 36px); gap: 4px; }
.pad button { font: 700 16px var(--ui); color: var(--text); background: var(--chip); border: 1px solid var(--chip-line); cursor: pointer; }
.pad button:hover, .pad button:focus-visible { background: var(--active); outline: none; }
.pad .u { grid-column: 2; grid-row: 1; }
.pad .l { grid-column: 1; grid-row: 2; }
.pad .d { grid-column: 2; grid-row: 2; }
.pad .r { grid-column: 3; grid-row: 2; }

@media (max-width: 760px) {
  .info { max-width: none; right: max(16px, env(safe-area-inset-right, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); top: 112px; align-items: center; text-align: center; }
  .rightcol { display: none; }
  .mapcard .pic { margin-left: auto; margin-right: auto; }
  .bottom { width: calc(100vw - 32px); bottom: 140px; }
  .loader { left: 50%; transform: translateX(-50%); }
  .ring { width: 96px; height: 96px; }
  .bigz { font-size: 46px; }
}
@media (prefers-reduced-motion: reduce) {
  .bgstack .slide.show img, .bigz, .bigz span, .ring.hit .pop, .ring.hit .wave, .ring.rainbowed .done { animation: none; }
  .modes .slide, .snakebox, .snakewin, .bgstack .slide { transition: none; }
}
</style>
<script src="modes.js"></script>
<script src="config.js"></script>
<script src="zplus.js"></script>
<script>zpStart();</script>
</head>
<body>

<div class="bgstack" id="bgstack"></div>
<div class="shade"></div>

<header class="top">
  <div class="logo" id="logo"></div>
</header>

<div class="info">
  <div class="server" id="server">Connecting&hellip;</div>
  <div class="ver" id="ver"></div>
  <div class="mapcard" id="mapcard">
    <div class="label">Map</div>
    <div class="big" id="mapname">zb_downtown</div>
    <img class="pic" id="mappic" alt="" hidden>
  </div>
  <div class="me panel" id="me" hidden>
    <div class="label">You</div>
    <div id="mecard" hidden></div>
    <div>SteamID <b id="mesteam"></b></div>
    <div>Joining for <b id="metime">0:00</b></div>
  </div>
</div>

<main class="loader" id="loader" aria-label="Loading">
  <div class="ring" id="ring" role="button" tabindex="0" aria-label="Z">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="54"></circle>
      <circle class="done" id="done" cx="60" cy="60" r="54"></circle>
    </svg>
    <div class="wave"></div>
    <div class="pop"><div class="bigz"><span id="zletter">Z</span><span class="rainbow" id="zletter2" aria-hidden="true">Z</span></div></div>
  </div>
</main>

<div class="rightcol">
<section class="modes panel" id="modes" aria-live="polite">
  <div class="head"><span id="modeshead">Game modes</span><span class="num" id="modecount"></span></div>
  <div class="slide" id="modeslide">
    <div class="group" id="modegroup"></div>
    <div class="name" id="modename"></div>
    <div class="kind" id="modekind"></div>
    <div class="sub" id="modesub" hidden></div>
    <div class="desc" id="modedesc"></div>
  </div>
</section>
<section class="live panel" id="live" hidden>
  <div class="head"><span id="livehead">Right now</span><span class="age" id="liveage"></span></div>
  <div id="livebody"></div>
</section>
</div>

<div class="bottom">
  <div class="status" id="statusline"><span id="status">Retrieving server info</span> <span class="count" id="sub"></span></div>
  <section class="facts panel" id="factsbox">
    <div class="head" id="factshead">Did you know</div>
    <div id="fact"></div>
  </section>
</div>

<div class="snakebox" id="snakebox" aria-hidden="true">
  <div class="snakewin panel" role="dialog" aria-label="Arcade">
    <div class="snakehead">
      <div class="snaketitle" id="arcadetitle">JS<span class="r">TOUHOU</span></div>
      <button type="button" id="snakeclose" aria-label="Close">&times;</button>
    </div>
    <div class="arcadetabs">
      <button type="button" class="on" data-game="danmaku">JSTouhou</button>
      <button type="button" data-game="snake">Z-Snake</button>
    </div>
    <div class="danmakubody" id="danmakupane" hidden>
      <div class="danmakuframe" id="danmakuframe"></div>
      <div class="danmakuhint">JSTouhou, based on toho-like-js by <a href="https://github.com/takahirox/toho-like-js" target="_blank" rel="noopener">takahirox</a></div>
    </div>
    <div class="snakebody" id="snakepane">
      <div class="scores"><span>Score <b id="snakescore">0</b></span><span>Best <b id="snakebest">0</b></span></div>
      <canvas id="snake" width="400" height="400"></canvas>
      <div class="snakehint" id="snakehint">Arrow keys or WASD</div>
      <div class="pad">
        <button type="button" class="u" data-dir="up" aria-label="Up">&#9650;</button>
        <button type="button" class="l" data-dir="left" aria-label="Left">&#9664;</button>
        <button type="button" class="d" data-dir="down" aria-label="Down">&#9660;</button>
        <button type="button" class="r" data-dir="right" aria-label="Right">&#9654;</button>
      </div>
    </div>
  </div>
</div>

<script src="arcade.js"></script>
<script>
/* settings come from config.js, see zplus.js for the helpers */
var zcBgSettings = zpConfig.backgrounds || {};
var zcBgFolder = zpPick(zcBgSettings.folder, "bg/");
var zcBgSeconds = zpPick(zcBgSettings.seconds, 12);
var zcBgMax = zpPick(zcBgSettings.max, 50);
var zcBgStyle = zpPick(zcBgSettings.transition, "slide");
var zcFacts = zpConfig.facts || [];
var zcModeGroups2 = zpModeGroups();

zpFillLogo(document.getElementById("logo"));
document.getElementById("ver").innerHTML = zpPick(zpConfig.versionLine, "");
if (zpPick(zpConfig.serverName, "") !== "") document.getElementById("server").textContent = zpConfig.serverName;
document.getElementById("modeshead").textContent = zpPick(zpConfig.modesTitle, "Game modes");
document.getElementById("factshead").textContent = zpPick(zpConfig.factsTitle, "Did you know");
var zcLetter = zpPick(zpConfig.spinnerLetter, "Z");
document.getElementById("zletter").textContent = zcLetter;
document.getElementById("zletter2").textContent = zcLetter;

var zcPanelIds = { server: "server", version: "ver", map: "mapcard", spinner: "loader", modes: "modes", facts: "factsbox", status: "statusline" };
for (var panelKey in zcPanelIds) {
  if (!zpPanelOn(panelKey)) document.getElementById(zcPanelIds[panelKey]).hidden = true;
}
if (zpPick(zpConfig.versionLine, "") === "") document.getElementById("ver").hidden = true;
if (zcFacts.length === 0) document.getElementById("factsbox").hidden = true;
if (zcModeGroups2.length === 0) document.getElementById("modes").hidden = true;
if (zcBgStyle === "fade" || zcBgStyle === "none") document.getElementById("bgstack").className = "bgstack " + zcBgStyle;

/* backgrounds */
var zcStack = document.getElementById("bgstack");
var zcBgImgs = [];
var zcBgIndex = 0;
var zcBgTimer = null;
function zcFindBackground(number) {
  if (number > zcBgMax) return;
  var probe = new Image();
  probe.onload = function () {
    probe.alt = "";
    var slideBox = document.createElement("div");
    slideBox.className = "slide";
    slideBox.appendChild(probe);
    zcStack.appendChild(slideBox);
    zcBgImgs.push(slideBox);
    if (zcBgImgs.length === 1) {
      slideBox.className = "slide first";
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { slideBox.className = "slide first show"; });
      });
    }
    if (zcBgImgs.length === 2 && zcBgTimer === null && zcBgSeconds > 0) {
      zcBgTimer = setInterval(zcNextBackground, zcBgSeconds * 1000);
    }
    zcFindBackground(number + 1);
  };
  probe.src = zpRoot + zcBgFolder + number + ".jpg";
}
/* old slide gets pushed out to the left while the new one slides in from the right */
function zcNextBackground() {
  if (document.body.classList.contains("arcadeopen")) return;
  var oldSlide = zcBgImgs[zcBgIndex];
  zcBgIndex = (zcBgIndex + 1) % zcBgImgs.length;
  var newSlide = zcBgImgs[zcBgIndex];
  newSlide.className = "slide park";
  void newSlide.offsetWidth;
  oldSlide.className = "slide out";
  newSlide.className = "slide show";
  setTimeout(function () {
    if (oldSlide !== zcBgImgs[zcBgIndex]) oldSlide.className = "slide park";
  }, 1500);
}
zcFindBackground(1);

/* game modes cycle on their own, the loading screen can't be clicked in game */
var zcModeSlides = [];
var zcModeCount = 0;
for (var g = 0; g < zcModeGroups2.length; g++) {
  for (var m = 0; m < zcModeGroups2[g].modes.length; m++) {
    var modeInfo = zcModeGroups2[g].modes[m];
    zcModeCount++;
    zcModeSlides.push({ group: zcModeGroups2[g].group, mode: modeInfo, sub: null, number: zcModeCount });
    if (modeInfo.subs) {
      for (var c = 0; c < modeInfo.subs.length; c++) {
        zcModeSlides.push({ group: zcModeGroups2[g].group, mode: modeInfo, sub: modeInfo.subs[c], number: zcModeCount });
      }
    }
  }
}
var zcModeSlideBox = document.getElementById("modeslide");
var zcModeAt = 0;
while (zcModeSlides.length > 0) {
  zcModeAt = Math.floor(Math.random() * zcModeSlides.length);
  if (zcModeSlides[zcModeAt].sub === null) break;
}
function zcFillMode(slideInfo) {
  document.getElementById("modecount").textContent = slideInfo.number + " / " + zcModeCount;
  document.getElementById("modegroup").textContent = slideInfo.group;
  document.getElementById("modename").textContent = slideInfo.mode.name;
  document.getElementById("modekind").textContent = slideInfo.mode.kind;
  var subLine = document.getElementById("modesub");
  if (slideInfo.sub) {
    subLine.textContent = slideInfo.sub.name;
    subLine.hidden = false;
    document.getElementById("modedesc").textContent = slideInfo.sub.desc;
  } else {
    subLine.hidden = true;
    document.getElementById("modedesc").textContent = slideInfo.mode.desc;
  }
}
/* longer descriptions stay up a bit longer */
function zcModeWait(slideInfo) {
  var textLen = slideInfo.sub ? slideInfo.sub.desc.length : slideInfo.mode.desc.length;
  return Math.min(12000, 5000 + textLen * 40);
}
function zcNextMode() {
  zcModeSlideBox.className = "slide fade";
  setTimeout(function () {
    zcModeAt = (zcModeAt + 1) % zcModeSlides.length;
    zcFillMode(zcModeSlides[zcModeAt]);
    zcModeSlideBox.className = "slide";
    setTimeout(zcNextMode, zcModeWait(zcModeSlides[zcModeAt]));
  }, 400);
}
if (zcModeSlides.length > 0) {
  zcFillMode(zcModeSlides[zcModeAt]);
  setTimeout(zcNextMode, zcModeWait(zcModeSlides[zcModeAt]));
}

/* map picture: maps/<map>.jpg or .png in this repo, then the game's own map thumbnail */
var zcMapPic = document.getElementById("mappic");
var zcMapTries = [];
function zcTryMapPic() {
  if (zcMapTries.length === 0) { zcMapPic.hidden = true; return; }
  zcMapPic.src = zcMapTries.shift();
}
zcMapPic.onload = function () { zcMapPic.hidden = false; };
zcMapPic.onerror = zcTryMapPic;
function zcShowMap(mapName) {
  document.getElementById("mapname").textContent = mapName;
  var safeName = encodeURIComponent(mapName);
  zcMapPic.hidden = true;
  if (!zpPanelOn("mapPicture")) { zcMapTries = []; return; }
  var picFolder = zpRoot + zpPick(zpConfig.mapPictures, "maps/");
  zcMapTries = [picFolder + safeName + ".jpg", picFolder + safeName + ".png", "asset://garrysmod/maps/thumb/" + safeName + ".png"];
  zcTryMapPic();
}

/* the joining player: steamid from GameDetails (64-bit) turned into STEAM_0:x:y */
function zcSteamText(steamId) {
  var idText = String(steamId);
  if (!/^\d{17}$/.test(idText)) return idText;
  var highPart = parseInt(idText.slice(0, 8), 10) - 76561197;
  var lowPart = parseInt(idText.slice(8), 10) - 960265728;
  var accountId = highPart * 1000000000 + lowPart;
  if (accountId < 0) return idText;
  return "STEAM_0:" + (accountId % 2) + ":" + Math.floor(accountId / 2);
}
var zcJoinStart = Date.now();
function zcShowMe(steamId) {
  if (!steamId || !zpPanelOn("player")) return;
  document.getElementById("mesteam").textContent = zcSteamText(steamId);
  document.getElementById("me").hidden = false;
  zcLoadCard(String(steamId));
}

/* stats api (worker/), only used when config.js has an api address */
var zcApiBase = zpPick(zpConfig.api, "");
if (zcApiBase !== "" && zcApiBase.charAt(zcApiBase.length - 1) !== "/") zcApiBase = zcApiBase + "/";
function zcGetJson(apiPath, whenDone) {
  if (zcApiBase === "") { whenDone(null); return; }
  var apiReq = new XMLHttpRequest();
  var answered = false;
  function finish(replyData) {
    if (answered) return;
    answered = true;
    whenDone(replyData);
  }
  apiReq.open("GET", zcApiBase + apiPath, true);
  apiReq.timeout = 5000;
  apiReq.onload = function () {
    if (apiReq.status !== 200) { finish(null); return; }
    try { finish(JSON.parse(apiReq.responseText)); } catch (err) { finish(null); }
  };
  apiReq.onerror = function () { finish(null); };
  apiReq.ontimeout = function () { finish(null); };
  apiReq.send();
}
function zcSafe(rawValue) {
  var holderBox = document.createElement("div");
  holderBox.textContent = rawValue === undefined || rawValue === null ? "" : String(rawValue);
  return holderBox.innerHTML;
}
function zcClock(totalSecs) {
  totalSecs = Math.max(0, Math.floor(totalSecs || 0));
  var leftOver = totalSecs % 60;
  return Math.floor(totalSecs / 60) + ":" + (leftOver < 10 ? "0" : "") + leftOver;
}

var zcCardAsked = "";
function zcShowCard(cardInfo, avatarUrl) {
  var cardBox = document.getElementById("mecard");
  var cardHtml = "";
  if (avatarUrl) cardHtml += '<img class="avatar" alt="" src="' + zcSafe(avatarUrl) + '">';
  cardHtml += '<div class="myname">' + zcSafe(cardInfo.name) + "</div>";
  if (cardInfo.title) cardHtml += '<div class="mytitle"' + (cardInfo.titleColor ? ' style="color:' + zcSafe(cardInfo.titleColor) + '"' : "") + ">" + zcSafe(cardInfo.title) + "</div>";
  if (cardInfo.level !== undefined) {
    cardHtml += '<div class="mylevel">Level <b>' + zcSafe(cardInfo.level) + "</b>";
    if (cardInfo.prestige) cardHtml += " &middot; Prestige <b>" + zcSafe(cardInfo.prestige) + "</b>";
    cardHtml += "</div>";
  }
  var wantedStats = zpConfig.playerCardStats || [];
  var statList = cardInfo.stats || [];
  var statsHtml = "";
  for (var ws = 0; ws < wantedStats.length; ws++) {
    for (var cs = 0; cs < statList.length; cs++) {
      if (statList[cs].label === wantedStats[ws]) statsHtml += "<span>" + zcSafe(statList[cs].label) + " <b>" + zcSafe(statList[cs].value) + "</b></span>";
    }
  }
  if (statsHtml !== "") cardHtml += '<div class="mystats">' + statsHtml + "</div>";
  cardBox.innerHTML = cardHtml;
  cardBox.hidden = false;
}
function zcLoadCard(steamId) {
  if (zcApiBase === "" || zcCardAsked === steamId || !/^\d{17}$/.test(steamId)) return;
  zcCardAsked = steamId;
  zcGetJson("player/" + steamId, function (replyData) {
    if (!replyData) return;
    if (replyData.found && replyData.card) {
      zcShowCard(replyData.card, replyData.avatar);
    } else {
      var welcomeBox = document.getElementById("mecard");
      welcomeBox.innerHTML = '<div class="myname">' + zcSafe(zpPick(zpConfig.newPlayerText, "First time here? Welcome!")) + "</div>";
      welcomeBox.hidden = false;
    }
  });
}

var zcRoundEnd = 0;
function zcShowLive(replyData) {
  var liveBox = document.getElementById("live");
  var liveBody = document.getElementById("livebody");
  if (!replyData || !replyData.found || !replyData.status) {
    if (!liveBox.hidden) liveBody.innerHTML = '<div class="off">Live info unavailable right now</div>';
    return;
  }
  var liveInfo = replyData.status;
  if (replyData.age > zpPick(zpConfig.liveMaxAge, 120)) {
    liveBody.innerHTML = '<div class="off">Live info unavailable right now</div>';
    document.getElementById("liveage").textContent = "";
    liveBox.hidden = false;
    zcRoundEnd = 0;
    return;
  }
  var liveHtml = '<div class="row">Players <b>' + zcSafe(liveInfo.players) + " / " + zcSafe(liveInfo.maxPlayers) + (liveInfo.bots ? " + " + zcSafe(liveInfo.bots) + " bots" : "") + "</b></div>";
  if (liveInfo.mode) liveHtml += '<div class="row">Mode <b>' + zcSafe(liveInfo.mode) + (liveInfo.subtype ? " &middot; " + zcSafe(liveInfo.subtype) : "") + "</b></div>";
  if (liveInfo.roundState) liveHtml += '<div class="row">Round' + (liveInfo.round ? " " + zcSafe(liveInfo.round) : "") + ' <b><span>' + zcSafe(liveInfo.roundState) + '</span><span id="livetime"></span></b></div>';
  var onlineList = liveInfo.online || [];
  if (onlineList.length > 0) {
    var nameBits = [];
    var nameLimit = zpPick(zpConfig.liveNames, 8);
    for (var on = 0; on < onlineList.length && on < nameLimit; on++) {
      nameBits.push("<b>" + zcSafe(onlineList[on].name) + "</b>" + (onlineList[on].level !== undefined ? " " + zcSafe(onlineList[on].level) : ""));
    }
    var moreCount = onlineList.length - nameBits.length;
    liveHtml += '<div class="names">' + nameBits.join(", ") + (moreCount > 0 ? " and " + moreCount + " more" : "") + "</div>";
  }
  liveBody.innerHTML = liveHtml;
  zcRoundEnd = liveInfo.timeLeft > 0 ? Date.now() + (liveInfo.timeLeft - (replyData.age || 0)) * 1000 : 0;
  zcLiveAge = Date.now() - (replyData.age || 0) * 1000;
  zcTickLive();
  liveBox.hidden = false;
}
var zcLiveAge = 0;
function zcTickLive() {
  var timeBox = document.getElementById("livetime");
  if (timeBox) timeBox.textContent = zcRoundEnd > Date.now() ? " \u00b7 " + zcClock((zcRoundEnd - Date.now()) / 1000) + " left" : "";
  if (zcLiveAge > 0) document.getElementById("liveage").textContent = "updated " + Math.floor((Date.now() - zcLiveAge) / 1000) + "s ago";
}
setInterval(zcTickLive, 1000);
function zcLoadLive() {
  zcGetJson("server", zcShowLive);
}
if (zcApiBase !== "" && zpPanelOn("live")) {
  document.getElementById("livehead").textContent = zpPick(zpConfig.liveTitle, "Right now");
  zcLoadLive();
  setInterval(zcLoadLive, Math.max(5, zpPick(zpConfig.apiRefresh, 15)) * 1000);
}
var zcUrlSteamId = zpParam("steamid");
if (/^\d{17}$/.test(zcUrlSteamId)) zcShowMe(zcUrlSteamId);
setInterval(function () {
  var secs = Math.floor((Date.now() - zcJoinStart) / 1000);
  var restSecs = secs % 60;
  document.getElementById("metime").textContent = Math.floor(secs / 60) + ":" + (restSecs < 10 ? "0" : "") + restSecs;
}, 1000);

var zcFactBox = document.getElementById("fact");
var zcFactIndex = Math.floor(Math.random() * Math.max(1, zcFacts.length));
function zcNextFact() {
  if (zcFacts.length === 0) return;
  zcFactBox.className = "fade";
  setTimeout(function () {
    zcFactBox.textContent = zcFacts[zcFactIndex];
    zcFactIndex = (zcFactIndex + 1) % zcFacts.length;
    zcFactBox.className = "";
  }, 400);
}
if (zcFacts.length > 0) {
  zcFactBox.textContent = zcFacts[zcFactIndex];
  zcFactIndex = (zcFactIndex + 1) % zcFacts.length;
}
setInterval(zcNextFact, 8000);

var zcRing = document.getElementById("done");
var zcRingLen = 2 * Math.PI * 54;
zcRing.style.strokeDasharray = zcRingLen;
zcRing.style.strokeDashoffset = zcRingLen;
var zcFilesTotal = 0;
var zcFilesNeeded = 0;
var zcFileName = "";
function zcDraw() {
  var part = 0;
  if (zcFilesTotal > 0) part = (zcFilesTotal - zcFilesNeeded) / zcFilesTotal;
  if (part < 0) part = 0;
  if (part > 1) part = 1;
  zcRing.style.strokeDashoffset = zcRingLen * (1 - part);
  var line = "";
  if (zcFilesTotal > 0 && zcFilesNeeded > 0) line = "· " + (zcFilesTotal - zcFilesNeeded) + " / " + zcFilesTotal + " files";
  if (zcFileName !== "" && zcFilesNeeded > 0) line = line + " · " + zcFileName;
  document.getElementById("sub").textContent = line;
}

/* easter egg */
var zcClicks = [];
var zcRainbow = false;
var zcZRing = document.getElementById("ring");
function zcHitZ() {
  var nowMs = Date.now();
  zcClicks.push(nowMs);
  while (zcClicks.length > 0 && nowMs - zcClicks[0] > 3000) zcClicks.shift();
  var pitchStep = Math.min(zcClicks.length, 6);
  zcTone("square", 180 + pitchStep * 60, (180 + pitchStep * 60) * 2.4, 0.22, 0.25);
  zcZRing.classList.remove("hit");
  void zcZRing.offsetWidth;
  zcZRing.classList.add("hit");
  if (zcClicks.length >= 5) {
    zcClicks = [];
    zcRainbow = !zcRainbow;
    zcZRing.classList.toggle("rainbowed", zcRainbow);
    if (zcRainbow) {
      zcChime();
      if (zpConfig.arcade === false) return;
      setTimeout(zcOpenSnake, 700);
    }
  }
}
zcZRing.addEventListener("click", zcHitZ);
zcZRing.addEventListener("keydown", function (ev) {
  if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); zcHitZ(); }
});

var zcSnakeBox = document.getElementById("snakebox");
function zcOpenSnake() {
  zcSnakeBox.classList.add("open");
  document.body.classList.add("arcadeopen");
  zcSnakeBox.setAttribute("aria-hidden", "false");
  zcShowArcade(zcArcade);
  document.getElementById("snakeclose").focus();
}
function zcCloseSnake() {
  zcSnakeBox.classList.remove("open");
  document.body.classList.remove("arcadeopen");
  zcSnakeBox.setAttribute("aria-hidden", "true");
  zcStopSnake();
  zcStopDanmaku();
}
document.getElementById("snakeclose").addEventListener("click", zcCloseSnake);
zcSnakeBox.addEventListener("click", function (ev) { if (ev.target === zcSnakeBox) zcCloseSnake(); });
var zcInGame = false;
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
  if (!zcInGame) { zcFilesTotal = 0; zcFilesNeeded = 0; zcFileName = ""; zcDraw(); }
  zcInGame = true;
  if (typeof volume === "number") zcVolume = volume;
  document.getElementById("server").textContent = servername;
  zcShowMap(mapname);
  zcShowMe(steamid);
}
function SetStatusChanged(statusText) { zcInGame = true; document.getElementById("status").textContent = statusText.replace(/\.+$/, ""); }
function SetFilesTotal(total) { zcInGame = true; zcFilesTotal = total; zcDraw(); }
function SetFilesNeeded(needed) { zcInGame = true; zcFilesNeeded = needed; zcDraw(); }
function DownloadingFile(fileName) { zcInGame = true; zcFileName = fileName.split("/").pop(); zcDraw(); }

var zcFakeFiles = ["metrocop_gear.mdl", "ambient3.mp3", "stalker_vignette.vtf", "zb_downtown.ain", "sector_lockdown.wav", "w_oicw.mdl"];
var zcFakeStatus = ["Retrieving server info", "Workshop complete", "Downloading files", "Loading resources", "Starting Lua", "Sending client info"];
setTimeout(function () {
  if (zcInGame) return;
  document.getElementById("server").textContent = zpPick(zpConfig.serverName, "") || "Server name";
  zcShowMap("zb_downtown");
  if (zcUrlSteamId === "") zcShowMe("76561197960287930");
  var tick = 0;
  zcFilesTotal = 186; zcFilesNeeded = 186;
  var fakeLoop = setInterval(function () {
    if (zcInGame) { clearInterval(fakeLoop); return; }
    tick++;
    if (zcFilesNeeded > 0) {
      zcFilesNeeded = Math.max(0, zcFilesNeeded - Math.ceil(Math.random() * 3));
      zcFileName = zcFakeFiles[tick % zcFakeFiles.length];
      document.getElementById("status").textContent = zcFakeStatus[Math.min(2, Math.floor(tick / 5))];
    } else {
      zcFileName = "";
      var stage = 3 + Math.floor((tick % 30) / 10);
      document.getElementById("status").textContent = zcFakeStatus[Math.min(zcFakeStatus.length - 1, stage)];
      if (tick % 30 === 29) zcFilesNeeded = zcFilesTotal;
    }
    zcDraw();
  }, 260);
}, 1200);
</script>
