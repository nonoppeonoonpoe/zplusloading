<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Z-City+ MOTD</title>
<meta name="viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap">
<style>
:root {
  --panel: rgba(25, 25, 30, 0.88);
  --panel-2: rgba(255, 255, 255, 0.04);
  --edge: rgba(155, 0, 0, 0.94);
  --red: #c80000;
  --hot: #e23b3b;
  --text: #f2eeee;
  --dim: #b4adad;
  --ui: "Bahnschrift", "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --logo: "Russo One", "Bahnschrift", "Arial Black", sans-serif;
  --bg: #0b0b0e;
  --panel-solid: rgba(18, 18, 22, 0.97);
  --red-dark: #5a0000;
  --glow: rgba(200, 0, 0, 0.6);
  --hover: rgba(150, 0, 0, 0.3);
  --active: rgba(150, 0, 0, 0.6);
  --pick: rgba(150, 0, 0, 0.75);
  --tab-mark: #ff3b3b;
  --bind: #e8b04a;
  --bind-line: rgba(232, 176, 74, 0.5);
  --logo-main: #ffffff;
  --line: rgba(255, 255, 255, 0.08);
  --chip: rgba(255, 255, 255, 0.05);
  --chip-line: rgba(255, 255, 255, 0.13);
  --faint: rgba(242, 238, 238, 0.5);
  --shadow: rgba(0, 0, 0, 0.8);
  --shade-rgb: 8, 8, 10;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 16px; overflow: hidden; }
[hidden] { display: none !important; }

.bg { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: var(--bg) center / cover no-repeat; filter: blur(6px) brightness(0.45); transform: scale(1.05); }

.shell {
  position: relative; z-index: 1; height: 100%; box-sizing: border-box;
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 14px;
  padding-block: 18px 30px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
body.zp-lights .shell { padding-top: 50px; }
.zpsnow { z-index: 0 !important; }
.panel { background: var(--panel); border: 1.5px solid var(--edge); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-sizing: border-box; }

.head { display: flex; align-items: center; gap: 22px; padding: 14px 22px; flex-wrap: wrap; }
.logo { font-family: var(--logo); font-size: 40px; line-height: 1; letter-spacing: 0.04em; transform: skewX(-10deg); white-space: nowrap; }
.logo .z, .logo .plus { color: var(--red); }
.logo .plus { font-size: 0.72em; vertical-align: 0.32em; margin-left: 0.06em; }
.headtext { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; border-left: 1px solid var(--line); padding-left: 22px; }
.welcome { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hot); }
.server { font-size: 30px; font-weight: 700; letter-spacing: 0.02em; overflow-wrap: anywhere; }
.map { font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.map b { color: var(--text); font-weight: 600; }

.body { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; min-height: 0; }
.tabs { display: flex; flex-direction: column; padding: 8px 0; overflow-y: auto; }
.tabs button {
  text-align: left; font: 700 16px var(--ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
  background: none; border: 0; border-left: 3px solid transparent; padding: 12px 18px; cursor: pointer; transition: background 0.2s, color 0.2s;
}
.tabs button:hover, .tabs button:focus-visible { color: var(--text); background: var(--hover); outline: none; }
.tabs button.on { color: var(--text); background: var(--active); border-left-color: var(--tab-mark); }

.pane { overflow-y: auto; padding: 22px 26px 30px; min-width: 0; }
.page { animation: pagein 0.3s ease; }
@keyframes pagein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page h2 { font-family: var(--logo); font-weight: 400; font-size: 26px; transform: skewX(-8deg); margin: 0 0 4px; letter-spacing: 0.03em; }
.lede { color: var(--dim); font-size: 17px; margin: 0 0 20px; max-width: 80ch; line-height: 1.45; }
.ph { display: inline-block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bg); background: var(--bind); padding: 2px 7px; margin-left: 10px; vertical-align: 3px; transform: none; font-family: var(--ui); font-weight: 700; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--panel-2); border: 1px solid var(--line); padding: 14px 16px; }
.card h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: 0.02em; }
.card p { margin: 0; color: var(--dim); line-height: 1.45; font-size: 15px; }
.card .tag { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--hot); margin-bottom: 6px; }

.rules { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 10px; counter-reset: rule; }
.rules li { counter-increment: rule; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 14px; align-items: start; background: var(--panel-2); border: 1px solid var(--line); padding: 14px 16px; }
.rules li::before { content: counter(rule); font-family: var(--logo); font-size: 26px; color: var(--red); line-height: 1; text-align: center; padding-top: 2px; }
.rules b { display: block; font-size: 17px; margin-bottom: 3px; }
.rules span { color: var(--dim); line-height: 1.45; font-size: 15px; }

.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 8px 14px; }
.keygroup { margin-bottom: 22px; }
.keygroup h3 { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hot); margin: 0 0 10px; font-weight: 700; }
.key { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: center; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); }
.key kbd { justify-self: start; font: 700 14px var(--ui); letter-spacing: 0.04em; color: var(--text); background: var(--line); border: 1px solid var(--chip-line); border-bottom-width: 3px; padding: 4px 9px; white-space: nowrap; }
.key kbd.bind { color: var(--bind); border-color: var(--bind-line); }
.key span { color: var(--dim); font-size: 15px; line-height: 1.35; }
.key span b { color: var(--text); font-weight: 600; }
.note { color: var(--dim); font-size: 14px; margin: 4px 0 0; }
.note kbd { font: 700 12px var(--ui); color: var(--bind); border: 1px solid var(--bind-line); padding: 1px 6px; }

/* modes */
.modewrap { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.modelist { border: 1px solid var(--line); background: var(--panel-2); }
.modelist .group { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--hot); padding: 12px 14px 4px; }
.modelist button {
  width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px;
  font: 600 16px var(--ui); color: var(--text); background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 14px; cursor: pointer; transition: background 0.2s;
}
.modelist button:hover, .modelist button:focus-visible { background: var(--hover); outline: none; }
.modelist button.on { background: var(--active); }
.modelist .kind { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); align-self: center; white-space: nowrap; }
.modelist .subcount { color: var(--hot); margin-right: 8px; }
.modelist button.on .subcount { color: var(--text); }
.detail { position: sticky; top: 0; border: 1px solid var(--line); background: var(--panel-2); padding: 22px 24px; }
.detail .kindbig { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hot); }
.detail h3 { font-family: var(--logo); font-weight: 400; font-size: 40px; margin: 6px 0 14px; transform: skewX(-8deg); line-height: 1.05; }
.subs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.subs button {
  font: 600 13px var(--ui); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--dim); background: var(--chip); border: 1px solid var(--chip-line); padding: 6px 12px; cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.subs button:hover, .subs button:focus-visible { color: var(--text); border-color: var(--edge); background: var(--hover); outline: none; }
.subs button.pick { color: var(--text); background: var(--pick); border-color: var(--edge); }
#modedesc { font-size: 20px; line-height: 1.5; max-width: 60ch; margin: 0; transition: opacity 0.18s; }
#modedesc.swap { opacity: 0; }
.detail .subnote { margin-top: 18px; color: var(--dim); font-size: 14px; }

.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.links .card a { color: var(--text); }
.go { display: inline-block; margin-top: 10px; font: 700 13px var(--ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); text-decoration: none; border: 1.5px solid var(--edge); padding: 6px 12px; }
.go:hover, .go:focus-visible { background: var(--active); outline: none; }
.custom { line-height: 1.5; color: var(--dim); max-width: 80ch; }
.custom a { color: var(--hot); }
.logo.haspic { transform: none; }
.logo .logoimg { display: block; max-height: 56px; }
.live .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--panel-2); border: 1px solid var(--line); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.tile .tag { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--hot); }
.tile b { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.you { margin-bottom: 18px; }
.youname { font-size: 30px; font-weight: 700; }
.youtitle { font-size: 17px; font-style: italic; color: var(--hot); }
.youlevel { color: var(--dim); font-size: 17px; margin-top: 4px; }
.youlevel b { color: var(--text); }
.livehead { font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hot); margin: 6px 0 10px; font-weight: 700; }
.board { width: 100%; max-width: 760px; border-collapse: collapse; font-size: 16px; }
.board th { text-align: left; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.board td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.board .num { text-align: right; font-variant-numeric: tabular-nums; }
.board tr.me td { color: var(--hot); font-style: italic; }
.dimcell { color: var(--dim); font-size: 14px; }
.closebtn { margin: 0 0 0 auto; cursor: pointer; background: none; }
#rulesdone { margin-top: 16px; cursor: pointer; background: none; }
#rulesdone:disabled { opacity: 0.6; cursor: default; }
.slot { display: inline-block; margin-top: 8px; font-family: Consolas, "Courier New", monospace; font-size: 13px; color: var(--bind); border: 1px dashed var(--bind-line); padding: 4px 8px; }

.closehint { position: fixed; z-index: 2; left: 50%; bottom: 8px; white-space: nowrap; transform: translateX(-50%); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }

@media (max-width: 760px) {
  body { overflow: auto; }
  .shell { height: auto; min-height: 100%; }
  .body { grid-template-columns: minmax(0, 1fr); }
  .tabs { flex-direction: row; overflow-x: auto; padding: 0; }
  .tabs button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 12px 14px; }
  .tabs button.on { border-bottom-color: var(--tab-mark); }
  .headtext { border-left: 0; padding-left: 0; }
  .modewrap { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
  .rules { grid-template-columns: minmax(0, 1fr); }
  .key { grid-template-columns: 96px minmax(0, 1fr); }
  .keys { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .page { animation: none; }
  #modedesc, .tabs button { transition: none; }
}
</style>
<script src="../modes.js"></script>
<script src="../config.js"></script>
<script src="../zplus.js"></script>
<script>zpStart();</script>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="shell">
  <header class="head panel">
    <div class="logo" id="logo"></div>
    <div class="headtext">
      <div class="welcome" id="welcome">Welcome to</div>
      <div class="server" id="server">this server</div>
      <div class="map" id="mapline">map <b id="mapname"></b></div>
    </div>
  </header>

  <div class="body">
    <nav class="tabs panel" id="tabs" aria-label="Sections"></nav>

    <main class="pane panel" id="pane"></main>
  </div>
</div>

<div class="closehint" id="closehint"></div>

<script>
var zcMotd = zpConfig.motd || {};
var zcBgImage = zpRoot + zpPick(zcMotd.background, "bg/1.jpg");

function zcParam(paramName) {
  var found = new RegExp("[?&]" + paramName + "=([^&#]*)").exec(window.location.search);
  if (!found) return "";
  try { return decodeURIComponent(found[1].replace(/\+/g, " ")); } catch (err) { return found[1]; }
}

document.getElementById("bg").style.backgroundImage = "url('" + zcBgImage + "')";

var zcServerName = zcParam("name");
var zcMapName = zcParam("map");
if (zcServerName !== "" && zcServerName.indexOf("%") !== 0) document.getElementById("server").textContent = zcServerName;
if (zcMapName !== "" && zcMapName.indexOf("%") !== 0) {
  document.getElementById("mapname").textContent = zcMapName;
} else {
  document.getElementById("mapline").hidden = true;
}

zpFillLogo(document.getElementById("logo"));
document.getElementById("welcome").textContent = zpPick(zcMotd.welcome, "Welcome to");
document.getElementById("closehint").textContent = zpPick(zcMotd.closeHint, "");
if (zcServerName === "" || zcServerName.indexOf("%") === 0) {
  if (zpPick(zpConfig.serverName, "") !== "") document.getElementById("server").textContent = zpConfig.serverName;
}

/* pages and tabs are built from config.js */
function zcMakeBox(tagName, boxClass, boxHtml) {
  var newBox = document.createElement(tagName);
  if (boxClass) newBox.className = boxClass;
  if (boxHtml !== undefined) newBox.innerHTML = boxHtml;
  return newBox;
}
function zcCardsHtml(cardList) {
  var cardsHtml = "";
  for (var ci = 0; ci < cardList.length; ci++) {
    var oneCard = cardList[ci];
    cardsHtml += '<div class="card">';
    if (oneCard.tag) cardsHtml += '<div class="tag">' + oneCard.tag + "</div>";
    cardsHtml += "<h3>" + zpPick(oneCard.title, "") + "</h3><p>" + zpPick(oneCard.text, "") + "</p>";
    if (oneCard.url) cardsHtml += '<a class="go" href="' + String(oneCard.url).replace(/"/g, "&quot;") + '" target="_blank" rel="noopener">' + zpPick(oneCard.button, "Open") + "</a>";
    cardsHtml += "</div>";
  }
  return cardsHtml;
}
var zcPageList = zcMotd.pages || [];
var zcTabBar = document.getElementById("tabs");
var zcPane = document.getElementById("pane");
for (var pi = 0; pi < zcPageList.length; pi++) {
  var pageInfo = zcPageList[pi];
  var pageId = String(zpPick(pageInfo.id, "page" + pi)).replace(/[^A-Za-z0-9_\-]/g, "");
  if (pageInfo.type === "modes" && zpModeGroups().length === 0) continue;
  var pageBox = zcMakeBox("section", "page");
  pageBox.id = "page-" + pageId;
  var pageTitle = zpPick(pageInfo.title, pageInfo.tab);
  var titleHtml = pageTitle;
  if (pageInfo.badge) titleHtml += ' <span class="ph">' + pageInfo.badge + "</span>";
  pageBox.appendChild(zcMakeBox("h2", "", titleHtml));
  if (pageInfo.lede) pageBox.appendChild(zcMakeBox("p", "lede", pageInfo.lede));
  if (pageInfo.type === "cards") {
    pageBox.appendChild(zcMakeBox("div", "grid", zcCardsHtml(pageInfo.cards || [])));
  } else if (pageInfo.type === "rules") {
    var rulesHtml = "";
    var ruleList = pageInfo.rules || [];
    for (var ri = 0; ri < ruleList.length; ri++) {
      rulesHtml += "<li><div><b>" + zpPick(ruleList[ri].title, "") + "</b><span>" + zpPick(ruleList[ri].text, "") + "</span></div></li>";
    }
    pageBox.appendChild(zcMakeBox("ol", "rules", rulesHtml));
  } else if (pageInfo.type === "keys") {
    var groupList = pageInfo.groups || [];
    for (var gi = 0; gi < groupList.length; gi++) {
      var keysHtml = "";
      var keyList = groupList[gi].keys || [];
      for (var ki = 0; ki < keyList.length; ki++) {
        keysHtml += '<div class="key"><kbd' + (keyList[ki].unbound ? ' class="bind"' : "") + ">" + zpPick(keyList[ki].key, "") + "</kbd><span>" + zpPick(keyList[ki].text, "") + "</span></div>";
      }
      pageBox.appendChild(zcMakeBox("div", "keygroup", "<h3>" + zpPick(groupList[gi].title, "") + '</h3><div class="keys">' + keysHtml + "</div>"));
    }
  } else if (pageInfo.type === "modes") {
    pageBox.appendChild(zcMakeBox("div", "modewrap", '<div class="modelist" id="modelist"></div><div class="detail" id="detail"><div class="kindbig" id="modekind"></div><h3 id="modename"></h3><div class="subs" id="modesubs"></div><p id="modedesc"></p><div class="subnote" id="subnote"></div></div>'));
  } else if (pageInfo.type === "stats" || pageInfo.type === "leaderboard" || pageInfo.type === "server") {
    var liveBox = zcMakeBox("div", "live");
    liveBox.id = "zp-" + pageInfo.type;
    pageBox.appendChild(liveBox);
    pageBox.setAttribute("data-live", "1");
  } else if (pageInfo.type === "html") {
    pageBox.appendChild(zcMakeBox("div", "custom", zpPick(pageInfo.html, "")));
  }
  pageBox.hidden = true;
  zcPane.appendChild(pageBox);
  var tabBtn = zcMakeBox("button");
  tabBtn.type = "button";
  tabBtn.setAttribute("data-page", pageId);
  tabBtn.textContent = zpPick(pageInfo.tab, pageTitle);
  if (pageBox.getAttribute("data-live") === "1") tabBtn.hidden = true;
  zcTabBar.appendChild(tabBtn);
}

/* stats and live info, sent in by the game server when the motd is opened in game */
function zcSafeText(rawValue) {
  var holder = document.createElement("div");
  holder.textContent = rawValue === undefined || rawValue === null ? "" : String(rawValue);
  return holder.innerHTML;
}
function zcShowLiveTab(liveType) {
  var liveBox = document.getElementById("zp-" + liveType);
  if (!liveBox) return;
  var livePageName = liveBox.parentNode.id.replace("page-", "");
  var liveBtn = document.querySelector('#tabs button[data-page="' + livePageName + '"]');
  if (liveBtn) liveBtn.hidden = false;
}
function zcTimeText(totalSecs) {
  totalSecs = Math.max(0, Math.floor(totalSecs || 0));
  var restSecs = totalSecs % 60;
  return Math.floor(totalSecs / 60) + ":" + (restSecs < 10 ? "0" : "") + restSecs;
}
function zcFillStats(cardInfo) {
  var statsBox = document.getElementById("zp-stats");
  if (!statsBox || !cardInfo) return;
  var statsHtml = '<div class="you"><div class="youname">' + zcSafeText(cardInfo.name) + "</div>";
  if (cardInfo.title) statsHtml += '<div class="youtitle"' + (cardInfo.titleColor ? ' style="color:' + zcSafeText(cardInfo.titleColor) + '"' : "") + ">" + zcSafeText(cardInfo.title) + "</div>";
  if (cardInfo.level !== undefined) {
    statsHtml += '<div class="youlevel">Level <b>' + zcSafeText(cardInfo.level) + "</b>";
    if (cardInfo.prestige) statsHtml += " &middot; Prestige <b>" + zcSafeText(cardInfo.prestige) + "</b>";
    statsHtml += "</div>";
  }
  statsHtml += "</div>";
  var statList = cardInfo.stats || [];
  if (statList.length > 0) {
    statsHtml += '<div class="tiles">';
    for (var si = 0; si < statList.length; si++) {
      statsHtml += '<div class="tile"><div class="tag">' + zcSafeText(statList[si].label) + "</div><b>" + zcSafeText(statList[si].value) + "</b></div>";
    }
    statsHtml += "</div>";
  }
  var bestModes = cardInfo.modes || [];
  if (bestModes.length > 0) {
    statsHtml += '<h3 class="livehead">Best modes</h3><table class="board"><tbody>';
    for (var mi = 0; mi < bestModes.length; mi++) {
      statsHtml += "<tr><td>" + zcSafeText(bestModes[mi].name) + '</td><td class="num">Level ' + zcSafeText(bestModes[mi].level) + '</td><td class="dimcell">' + zcSafeText(bestModes[mi].rank || "") + "</td></tr>";
    }
    statsHtml += "</tbody></table>";
  }
  statsBox.innerHTML = statsHtml;
  zcShowLiveTab("stats");
}
function zcFillBoard(boardInfo, mySteamId) {
  var boardBox = document.getElementById("zp-leaderboard");
  if (!boardBox || !boardInfo || !boardInfo.rows || boardInfo.rows.length === 0) return;
  var columnList = boardInfo.columns || [];
  var boardHtml = '<table class="board"><thead><tr><th class="num">#</th><th>Player</th>';
  for (var ci = 0; ci < columnList.length; ci++) boardHtml += '<th class="num">' + zcSafeText(columnList[ci]) + "</th>";
  boardHtml += "</tr></thead><tbody>";
  for (var ri = 0; ri < boardInfo.rows.length; ri++) {
    var rowInfo = boardInfo.rows[ri];
    boardHtml += "<tr" + (rowInfo.steamid && rowInfo.steamid === mySteamId ? ' class="me"' : "") + '><td class="num dimcell">' + (ri + 1) + "</td><td>" + zcSafeText(rowInfo.name) + "</td>";
    var valueList = rowInfo.values || [];
    for (var vi = 0; vi < valueList.length; vi++) boardHtml += '<td class="num">' + zcSafeText(valueList[vi]) + "</td>";
    boardHtml += "</tr>";
  }
  boardHtml += "</tbody></table>";
  boardBox.innerHTML = boardHtml;
  zcShowLiveTab("leaderboard");
}
var zcRoundEndsAt = 0;
function zcFillServer(serverInfo) {
  var serverBox = document.getElementById("zp-server");
  if (!serverBox || !serverInfo) return;
  var serverHtml = '<div class="tiles">';
  serverHtml += '<div class="tile"><div class="tag">Players</div><b>' + zcSafeText(serverInfo.players) + " / " + zcSafeText(serverInfo.maxPlayers) + "</b>" + (serverInfo.bots ? '<span class="dimcell">+ ' + zcSafeText(serverInfo.bots) + " bots</span>" : "") + "</div>";
  serverHtml += '<div class="tile"><div class="tag">Map</div><b>' + zcSafeText(serverInfo.map) + "</b></div>";
  if (serverInfo.mode) serverHtml += '<div class="tile"><div class="tag">Mode</div><b>' + zcSafeText(serverInfo.mode) + "</b>" + (serverInfo.subtype ? '<span class="dimcell">' + zcSafeText(serverInfo.subtype) + "</span>" : "") + "</div>";
  if (serverInfo.roundState) {
    serverHtml += '<div class="tile"><div class="tag">Round' + (serverInfo.round ? " " + zcSafeText(serverInfo.round) : "") + "</div><b>" + zcSafeText(serverInfo.roundState) + "</b>";
    if (serverInfo.timeLeft !== undefined && serverInfo.timeLeft > 0) serverHtml += '<span class="dimcell" id="zp-timeleft">' + zcTimeText(serverInfo.timeLeft) + " left</span>";
    serverHtml += "</div>";
  }
  serverHtml += "</div>";
  var onlineList = serverInfo.online || [];
  if (onlineList.length > 0) {
    serverHtml += '<h3 class="livehead">Online now</h3><table class="board"><tbody>';
    for (var oi = 0; oi < onlineList.length; oi++) {
      serverHtml += "<tr><td>" + zcSafeText(onlineList[oi].name) + "</td>" + (onlineList[oi].level !== undefined ? '<td class="num">Level ' + zcSafeText(onlineList[oi].level) + "</td>" : "") + "</tr>";
    }
    serverHtml += "</tbody></table>";
  }
  serverBox.innerHTML = serverHtml;
  if (serverInfo.timeLeft > 0) zcRoundEndsAt = Date.now() + serverInfo.timeLeft * 1000;
  zcShowLiveTab("server");
}
setInterval(function () {
  var timeBox = document.getElementById("zp-timeleft");
  if (!timeBox || zcRoundEndsAt === 0) return;
  timeBox.textContent = zcTimeText((zcRoundEndsAt - Date.now()) / 1000) + " left";
}, 1000);

function zcAddRulesButton() {
  var rulesPage = document.querySelector('.page ol.rules');
  if (!rulesPage || document.getElementById("rulesdone")) return;
  var doneBtn = zcMakeBox("button", "go");
  doneBtn.type = "button";
  doneBtn.id = "rulesdone";
  doneBtn.textContent = zpPick(zcMotd.rulesButton, "I've read the rules");
  doneBtn.addEventListener("click", function () {
    if (window.zplus && window.zplus.rulesRead) window.zplus.rulesRead();
    doneBtn.textContent = "Thanks!";
    doneBtn.disabled = true;
  });
  rulesPage.parentNode.appendChild(doneBtn);
}

window.ZPlus = {
  setData: function (motdData) {
    if (!motdData) return;
    var myId = motdData.player ? motdData.player.steamid : "";
    zcFillStats(motdData.player);
    zcFillBoard(motdData.leaderboard, myId);
    zcFillServer(motdData.server);
    if (motdData.server && motdData.server.hostname) document.getElementById("server").textContent = motdData.server.hostname;
    if (motdData.rulesButton) zcAddRulesButton();
  }
};

if (zpParam("ingame") === "1") {
  var closeBtn = zcMakeBox("button", "go closebtn");
  closeBtn.type = "button";
  closeBtn.textContent = "Close";
  closeBtn.addEventListener("click", function () {
    if (window.zplus && window.zplus.close) window.zplus.close();
  });
  document.querySelector(".head").appendChild(closeBtn);
}

if (zpParam("demo") === "1") {
  ZPlus.setData({
    player: { name: "Player", steamid: "76561197960287930", level: 42, prestige: 1, title: "Survivor", stats: [{ label: "Wins", value: 128 }, { label: "Playtime", value: "36h 12m" }, { label: "Best mode", value: "Homicide" }, { label: "Kills", value: 911 }], modes: [{ name: "Homicide", level: 18, rank: "Veteran" }, { name: "Stalker", level: 9, rank: "Regular" }] },
    server: { hostname: "Demo Server", map: "zb_downtown", players: 9, bots: 6, maxPlayers: 32, mode: "Homicide", subtype: "Partners", round: 14, roundState: "In round", timeLeft: 263, online: [{ name: "Player", level: 42 }, { name: "Someone", level: 7 }] },
    leaderboard: { columns: ["Level", "Wins", "Kills"], rows: [{ name: "Top player", values: [151, 900, 4000] }, { name: "Player", steamid: "76561197960287930", values: [92, 128, 911] }] },
    rulesButton: true
  });
}

/* tabs */
var zcTabBtns = document.querySelectorAll("#tabs button");
function zcShowPage(pageName) {
  for (var t = 0; t < zcTabBtns.length; t++) {
    var isThis = zcTabBtns[t].getAttribute("data-page") === pageName;
    zcTabBtns[t].className = isThis ? "on" : "";
    document.getElementById("page-" + zcTabBtns[t].getAttribute("data-page")).hidden = !isThis;
  }
  document.getElementById("pane").scrollTop = 0;
}
for (var tb = 0; tb < zcTabBtns.length; tb++) {
  zcTabBtns[tb].addEventListener("click", function () { zcShowPage(this.getAttribute("data-page")); });
}
if (zcTabBtns.length > 0) zcShowPage(zcTabBtns[0].getAttribute("data-page"));

/* modes */
var zcModeList = document.getElementById("modelist");
var zcMotdModes = zpModeGroups();
var zcModeBtns = [];
function zcShowMode(modeInfo, modeBtn) {
  for (var b = 0; b < zcModeBtns.length; b++) zcModeBtns[b].className = "";
  modeBtn.className = "on";
  document.getElementById("modekind").textContent = modeInfo.kind;
  document.getElementById("modename").textContent = modeInfo.name;
  var descBox = document.getElementById("modedesc");
  descBox.textContent = modeInfo.desc;
  var subBox = document.getElementById("modesubs");
  subBox.innerHTML = "";
  var subNote = document.getElementById("subnote");
  if (!modeInfo.subs) {
    subNote.textContent = "This mode has no subtypes.";
    return;
  }
  subNote.textContent = "Subtypes are rolled at random, so you won't know which one you get until the round starts.";
  var choices = [{ name: "Standard", desc: modeInfo.desc }].concat(modeInfo.subs);
  for (var c = 0; c < choices.length; c++) {
    (function (subInfo, isFirst) {
      var subBtn = document.createElement("button");
      subBtn.type = "button";
      subBtn.textContent = subInfo.name;
      if (isFirst) subBtn.className = "pick";
      subBtn.addEventListener("click", function () {
        var others = subBox.children;
        for (var k = 0; k < others.length; k++) others[k].className = "";
        subBtn.className = "pick";
        descBox.className = "swap";
        setTimeout(function () {
          descBox.textContent = subInfo.desc;
          descBox.className = "";
        }, 180);
      });
      subBox.appendChild(subBtn);
    })(choices[c], c === 0);
  }
}
for (var g = 0; zcModeList && g < zcMotdModes.length; g++) {
  var groupLabel = document.createElement("div");
  groupLabel.className = "group";
  groupLabel.textContent = zcMotdModes[g].group;
  zcModeList.appendChild(groupLabel);
  for (var m = 0; m < zcMotdModes[g].modes.length; m++) {
    (function (modeInfo) {
      var modeBtn = document.createElement("button");
      modeBtn.type = "button";
      var nameSpan = document.createElement("span");
      nameSpan.textContent = modeInfo.name;
      var kindSpan = document.createElement("span");
      kindSpan.className = "kind";
      if (modeInfo.subs) {
        var countSpan = document.createElement("span");
        countSpan.className = "subcount";
        countSpan.textContent = "+" + modeInfo.subs.length;
        kindSpan.appendChild(countSpan);
      }
      kindSpan.appendChild(document.createTextNode(modeInfo.kind));
      modeBtn.appendChild(nameSpan);
      modeBtn.appendChild(kindSpan);
      modeBtn.addEventListener("click", function () { zcShowMode(modeInfo, modeBtn); });
      zcModeBtns.push(modeBtn);
      zcModeList.appendChild(modeBtn);
    })(zcMotdModes[g].modes[m]);
  }
}
if (zcModeBtns.length > 0) zcModeBtns[0].click();
</script>
</body>
</html>
